[build-system]
requires = ["hatchling", "pip"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build]
sources = ["src"]
packages = ["src/imodulator"]

[project]
name = "imodulator"
version = "1.0.2"
authors = [
  { name="Duarte Silva", email="d.j.fernandes.da.silva@tue.nl" },
  { name="Ali Kaan Sünnetçioğlu", email="a.k.sunnetcioglu@tue.nl" }
]
maintainers = [
  { name="Duarte Silva", email="d.j.fernandes.da.silva@tue.nl" },
  { name="Ali Kaan Sünnetçioğlu", email="a.k.sunnetcioglu@tue.nl" }
]
description = "An all-in-one photonic electro-optic modulator design tool with complete modularity providing consistent optical mode solving, charge transport simulations, RF mode solving and transmission line analysis for arbitrary materials and cross sections."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
]
license = {file = "LICENSE"}
keywords = ["integrated photonics", "electro-optic modulators", "photonics simulation", "optical mode solver", "rf mode solver", "charge transport simulation", "electro-optic interaction"]
dependencies = [
    # femwell is installed by the custom build hook (hatch_build.py) from a
    # specific git commit because no compatible PyPI release exists yet.
    # Requires 'git' to be installed and in PATH — see INSTALL notes below.
    "matplotlib==3.9.0",
    "numpy>=2.0.0",
    "Pint>=0.24",
    "scipy==1.13.1",
    "shapely==2.0.4",
    "pyyaml==6.0.2",
    "pandas==2.3.0",
    "scikit-fem>=11.0.0",
    "gmsh>=4.11",
    "meshio>=5.3",
    "pygmsh>=7.1.17",
    "nextnanopy>=1.0.1",
    "openbandparams>=1.0",
    "solcore>=5.10.1",
]

[project.optional-dependencies]
# Install only the core optical/RF solvers without the charge-transport stack
# (useful on Windows where solcore's Fortran extensions may not compile):
#   pip install imodulator[core]
core = [
    "matplotlib==3.9.0",
    "numpy>=2.0.0",
    "Pint>=0.24",
    "scipy==1.13.1",
    "shapely==2.0.4",
    "pyyaml==6.0.2",
    "pandas==2.3.0",
    "scikit-fem>=11.0.0",
    "gmsh>=4.11",
    "meshio>=5.3",
    "pygmsh>=7.1.17",
]

[project.urls]
Homepage = "https://github.com/duarte-jfs/Imodulator"
Documentation = "https://imodulator.readthedocs.io/en/latest/"
Repository = "https://github.com/duarte-jfs/Imodulator"


[tool.hatch.build.targets.wheel]
packages = ["src/imodulator"]
include = [
    "src/imodulator/**/*.yaml",
    "src/imodulator/**/*.yml",
]

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE"]
exclude = ["build/**", "imgs/**", ".vscode/**", "*.egg-info"]